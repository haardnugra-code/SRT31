<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ef4444" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base with Rounded Corners -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Subtle Rim Glow Border -->
  <rect x="8" y="8" width="496" height="496" rx="100" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Central Shield / Emblem -->
  <g filter="url(#glow)">
    <!-- Dormitory Roof / Pinnacle -->
    <path d="M256 96 L384 196 L352 196 L352 356 C352 384 312 416 256 428 C200 416 160 384 160 356 L160 196 L128 196 Z" fill="url(#primaryGrad)" />
    
    <!-- Gold Accented Crest Line -->
    <path d="M256 128 L360 210 L336 210 L336 348 C336 368 304 394 256 404 C208 394 176 368 176 348 L176 210 L152 210 Z" fill="#ffffff" opacity="0.08" />

    <!-- Open Book / Education Icon in Shield -->
    <path d="M256 248 C276 236 304 236 324 242 L324 332 C304 326 276 326 256 338 C236 326 208 326 188 332 L188 242 C208 236 236 236 256 248 Z" fill="#ffffff" opacity="0.95" />
    <path d="M256 248 L256 338" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />

    <!-- Radiant Star / Flame above book -->
    <path d="M256 184 L264 206 L286 214 L264 222 L256 244 L248 222 L226 214 L248 206 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Circular Badge Pillars -->
  <circle cx="214" cy="286" r="6" fill="url(#goldGrad)" />
  <circle cx="298" cy="286" r="6" fill="url(#goldGrad)" />

  <!-- Monogram Pill at Bottom -->
  <rect x="176" y="372" width="160" height="28" rx="14" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2" />
  <text x="256" y="391" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="14" fill="#f8fafc" text-anchor="middle" letter-spacing="3">SEKOLAH RAKYAT</text>
</svg>
